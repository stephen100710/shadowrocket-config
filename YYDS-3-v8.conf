[Script]
# 微博信息流+视频流+评论区+搜索去广告 v8（2026-11-06：信息流 /2/statuses/container_timeline_hot + 视频流 /2/video/flow_stream + 评论区 /2/statuses/container_detail_comment + 帖子详情 /2/statuses/container_detail + 搜索 /2/searchall、/2/search/container_timeline、/2/search/finder；脚本与规则列表均托管于本人 GitHub stephen100710/shadowrocket-config，不再依赖 Muse 临时链接与 ACL4SSR；删带 mblogtype=1、mblogtypename=广告/热推、is_ad/is_ad_card/ad_marked、promotion/ad 标记的项，外加引用 kadmimage/ad.us.sinaimg.cn 这两个广告图床的项——正常帖子只用 weibocdn/sinaimg，不会误伤；格式不对或出错时原样返回，不会打不开）
# v8 改动：脚本与 8 个 RULE-SET 列表全部改走本人 GitHub（stephen100710/shadowrocket-config，raw.githubusercontent.com），不再用 Muse 48 小时临时链接，也不再直接引用 ACL4SSR——注意：列表从此是本仓库的快照，不再随 ACL4SSR 自动更新，如需更新需重新从 ACL4SSR 同步。
