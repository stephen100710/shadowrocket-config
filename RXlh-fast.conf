US-29 = https, 138.199.35.206, 9002
US-36 = https, 172.64.68.89, 443
US-37 = https, 23.133.176.14, 443

[Proxy Group]
Fast = select, US-33, US-32, US-16, US-34, US-28, US-27, US-25, US-30, US-21, US-26, US-23, US-24, US-22, US-29, US-36, US-37
