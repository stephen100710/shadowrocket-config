# RXlh-fast.conf
# 来源订阅: https://blog.kuaiyu.cc/tree/RXlh.yaml (2026-11-23 快照)
# 16 个节点,全部在 Colab + mihomo 实测下载速度 > 20 MB/s (2026-11-23)
